<!DOCTYPE html> 
 
<html> 
 
<head> 
 
 <meta charset="utf-8"> 
 
 <title>My A-Frame World</title> 
 
 <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script> 
 <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
 
</head> 
 
<body> 

  
  <a-asset>
    <img id ="meme" src ="images/IMG_2598.JPG">

    <a-asset-item
    id="maccy"
    src="images/pool0335_wm.glb"
    >
    </a-asset-item>
 </a-asset> 

 <a-scene> 



    <a-glft-model
        position="0 0 0"
    scale="200 200 200"
    src="#maccy">
  
    </a-glft-model>

   <a-box 
     position="0 1 -3" 
     color="#ff2a8a" 
     material="color: #f1c772; normalMap: #brick_diffuse"
     src="#meme">
    
   </a-box> 
 
   <a-plane 
     active="false"
     position="0 0 -4" 
     rotation="-90 0 0" 
     width="10" 
     height="10" 
     color="#7f7e3c"> 
   </a-plane> 
 
   <a-sky color="#241b2f"></a-sky> 
   <a-entity environment="preset: forest; dressingUniformScale: false; fog: 0.9; ground: canyon; groundColor: #505106; groundYScale: 8; horizonColor: #4a668e; lighting: point; seed: 3; shadow: true; shadowSize: 50; skyColor: #24347e"></a-entity>
 </a-scene> 
 
</body> 
 
</html>
